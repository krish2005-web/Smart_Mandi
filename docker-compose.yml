services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartmandi
      POSTGRES_USER: smartmandi
      POSTGRES_PASSWORD: smartmandi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmandi -d smartmandi"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://smartmandi:smartmandi@db:5432/smartmandi
      SECRET_KEY: change-me
      JWT_SECRET_KEY: change-me-too
      DEMO_MODE: "true"
    ports: ["5000:5000"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
volumes:
  pgdata:
