{% extends 'base.html' %}{% block content %}<main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><span class="text-secondary">Farmer Dashboard</span><h2 id="welcome">Loading…</h2></div><button id="logout" class="btn btn-outline-secondary">Logout</button></div><div class="row g-3" id="stats"></div><div class="row g-4 mt-1"><div class="col-lg-8"><div class="card border-0 shadow-sm"><div class="card-body"><div class="d-flex justify-content-between"><h4>My bookings</h4><button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#bookModal">Book slot</button></div><div id="bookings" class="table-responsive mt-3"></div></div></div></div><div class="col-lg-4"><div class="card border-0 shadow-sm"><div class="card-body"><h4>AI Assistant</h4><div id="chat" class="chatbox mb-2"></div><div class="input-group"><input id="chatInput" class="form-control" placeholder="Ask about my booking…"><button id="chatSend" class="btn btn-success">Send</button></div></div></div></div></div></main><div class="modal fade" id="bookModal"><div class="modal-dialog modal-lg"><div class="modal-content"><div class="modal-header"><h5>Book procurement slot</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="row g-3"><div class="col-md-6"><label>State</label><select id="bstate" class="form-select"></select></div><div class="col-md-6"><label>District</label><select id="bdistrict" class="form-select"></select></div><div class="col-md-6"><label>Block</label><select id="bblock" class="form-select"></select></div><div class="col-md-6"><label>Centre</label><select id="centre" class="form-select"></select></div><div class="col-md-6"><label>Crop</label><select id="crop" class="form-select"></select></div><div class="col-md-6"><label>Date</label><input id="slotDate" type="date" class="form-control"></div></div><div id="slots" class="row g-2 mt-3"></div></div></div></div></div>{% endblock %}
